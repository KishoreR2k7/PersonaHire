services:
  db:
    image: postgres:16-alpine
    container_name: persona_hire_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - persona_hire_internal

  redis:
    image: redis:7-alpine
    container_name: persona_hire_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-strongredispassword}
    volumes:
      - redis_data_prod:/data
    networks:
      - persona_hire_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: persona_hire_backend_prod
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - persona_hire_internal
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: persona_hire_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - persona_hire_internal

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  persona_hire_internal:
    driver: bridge
